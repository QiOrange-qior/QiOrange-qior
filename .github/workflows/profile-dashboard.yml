name: Refresh profile dashboard

on:
  workflow_dispatch:
  schedule:
    - cron: "23 2 * * *"
  push:
    branches: [main]
    paths:
      - "scripts/profile_dashboard.py"
      - ".github/workflows/profile-dashboard.yml"

permissions:
  contents: write

concurrency:
  group: profile-dashboard
  cancel-in-progress: false

jobs:
  refresh:
    if: github.repository == 'QiOrange-qior/QiOrange-qior'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out profile
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Generate public dashboard
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/profile_dashboard.py
      - name: Commit dashboard when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-dashboard.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "docs: refresh public profile dashboard"
          git push
